<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="900" height="230" role="img" aria-label="Lucca Prada - I build small software for real businesses">
  <title>lucca prada</title>
  <style>
    .paper  { fill: #f7f3ea; }
    .ink    { fill: #201c17; }
    .soft   { fill: #5f5749; }
    .pen    { stroke: #2b50c8; }
    .rule   { stroke: rgba(32,28,23,0.13); stroke-width: 1; }
    .margin { stroke: #c4553d; stroke-width: 1.2; opacity: .5; }
    .tape   { fill: rgba(224,205,155,0.55); }
    .cordline { stroke: #201c17; stroke-width: 1.6; fill: none; }
    .knob   { fill: #f7f3ea; stroke: #201c17; stroke-width: 1.6; }
    .serif  { font-family: Georgia, 'Times New Roman', serif; }
    .mono   { font-family: ui-monospace, 'Cascadia Code', Consolas, monospace; }

    /* the cord sways like the real one on the site. it is the only moving part. */
    .cord { animation: sway 5s ease-in-out infinite; transform-origin: 782px 0px; }
    @keyframes sway {
      0%, 100% { transform: rotate(-2.2deg); }
      50%      { transform: rotate(2.2deg); }
    }
    @media (prefers-reduced-motion: reduce) { .cord { animation: none; } }
  </style>

  <rect class="paper" width="900" height="230"/>

  <!-- ruled paper -->
  <g class="rule">
    <line x1="0" y1="46"  x2="900" y2="46"/>
    <line x1="0" y1="92"  x2="900" y2="92"/>
    <line x1="0" y1="138" x2="900" y2="138"/>
    <line x1="0" y1="184" x2="900" y2="184"/>
  </g>
  <line class="margin" x1="62" y1="0" x2="62" y2="230"/>

  <!-- tape, holding the page down -->
  <g transform="rotate(-3 120 20)">
    <rect class="tape" x="78" y="6" width="86" height="21" rx="1"/>
  </g>

  <!-- the lamp cord -->
  <g class="cord">
    <path class="cordline" d="M782 0 L782 84"/>
    <circle class="knob" cx="782" cy="91" r="6.5"/>
  </g>

  <!-- wordmark -->
  <text class="serif ink" x="92" y="104" font-size="52" font-weight="600" letter-spacing="-0.5">lucca prada</text>

  <!-- tagline, with the squiggle under the important bit -->
  <text class="serif soft" x="94" y="146" font-size="21" font-style="italic">i build small software for real businesses.</text>
  <g transform="translate(190 152)">
    <path class="pen" fill="none" stroke-width="1.9" stroke-linecap="round"
          d="M2 6 C 18 2, 38 9, 58 5 S 96 2, 118 6"/>
  </g>

  <text class="mono soft" x="94" y="192" font-size="13" letter-spacing="0.4">
    london, ontario  ·  backend + ai  ·  wsib co-op  ·  fanshawe cpa
  </text>
</svg>
